services:
  - type: web
    name: telegram-text-leech-bot
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: 36629816
        sync: false
      - key: b074123de6def8946d6bce8b4fff699a
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DUMP_CHANNEL
        value: "0"
      - key: PORT
        value: "8080"
      - key: WEB_SERVER
        value: "true"
      - key: PROGRESS_UPDATE_INTERVAL
        value: "4"
